<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>東京旅遊導覽</title>
  
  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff5252">
  
  <!-- iOS 專用設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="東京導覽">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 頁面容器：滿版背景 */
    .welcome-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* 模擬東京手繪風背景：結合柔和漸層與日式插畫氛圍 */
      background: linear-gradient(135deg, rgba(255, 235, 238, 0.8), rgba(227, 242, 253, 0.8)),
                  url('bg-tokyo.png') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      transition: opacity 0.5s ease;
    }

    /* 標題與副標題樣式 */
    .hero-title {
      font-size: 32px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
    }

    .hero-subtitle {
      font-size: 16px;
      color: #7f8c8d;
      margin-bottom: 40px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    /* 「開始導覽」按鈕設計 */
    .start-btn {
      background: #ff5252;
      color: white;
      font-size: 18px;
      font-weight: 600;
      padding: 16px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 82, 82, 0.4);
      transition: transform 0.2s, background-color 0.2s;
      text-decoration: none;
    }

    .start-btn:active {
      transform: scale(0.95);
      background-color: #ff1744;
    }

    /* 進入導覽後的「主選單頁面」（預設隱藏） */
    .main-app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f8f9fa;
      display: none;
      flex-direction: column;
      animation: fadeIn 0.5s ease;
    }

    .app-header {
      background: #ff5252;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      padding-top: max(16px, env(safe-area-inset-top));
    }

    .app-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- 1. 初始歡迎畫面（手繪風格背景 + 置中按鈕） -->
  <div class="welcome-screen" id="welcomeScreen">
    <h1 class="hero-title">🇯🇵 東京旅遊導覽</h1>
    <p class="hero-subtitle">探索日本冒險之旅</p>
    <button class="start-btn" onclick="startTour()">開始導覽</button>
  </div>

  <!-- 2. 導覽主畫面（點擊按鈕後顯示） -->
  <div class="main-app" id="mainApp">
    <header class="app-header">
      東京景點推薦
    </header>
    <main class="app-content">
      <div class="card">
        <h3>淺草寺與雷門</h3>
        <p>體驗傳統江戶風情，品嚐人形燒與拍下巨大紅燈籠。</p>
      </div>
      <div class="card">
        <h3>澀谷 Scramble 交叉口</h3>
        <p>感受全世界最繁忙十字路口的震撼魅力。</p>
      </div>
      <div class="card">
        <h3>新宿御苑</h3>
        <p>在都市叢林中享受片刻的寧靜與四季自然美景。</p>
      </div>
    </main>
  </div>

  <!-- 互動切換與 Service Worker 註冊 -->
  <script>
    function startTour() {
      // 隱藏歡迎畫面，顯示主選單
      document.getElementById('welcomeScreen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('welcomeScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
      }, 500);
    }

    // 註冊 PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW 註冊成功', reg))
          .catch(err => console.log('SW 註冊失敗', err));
      });
    }
  </script>
</body>
</html>
